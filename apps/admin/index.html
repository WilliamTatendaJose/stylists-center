<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stylists Center — Admin</title>
    <script>
      // Applied before any React module loads, so there is no flash of the
      // wrong theme on first paint — the same reasoning as index.css's
      // dark: variants living inside the shared UI primitives rather than
      // being computed after mount.
      (function () {
        var stored = localStorage.getItem('sc-admin-theme');
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
