name: Mobile Build

# Manual only: run it from the Actions tab when a new binary is actually
# needed. The EAS free plan has a small monthly build allowance, so merges to
# main do not build. App code that needs no new native module ships as an
# over-the-air update instead (ota-update.yml). A build is needed only when a
# native module is added or changed, or the app version in app.config.ts is
# bumped.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (see apps/mobile/eas.json)'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - development
          - production

# Queue rather than cancel: cancelling this job would not stop an EAS build
# already submitted to Expo's builders, it would just stop us watching it, so
# the log would stop reflecting what actually shipped. Same reasoning as
# ci.yml's deploy-web group.
concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sc/shared run build
      - run: pnpm --filter @sc/mobile run typecheck
      - run: pnpm --filter @sc/mobile run lint
      - run: pnpm --filter @sc/mobile run test

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # eas-cli reads and transpiles apps/mobile/app.config.ts locally before
      # it ever talks to Expo's servers, which needs the project's own
      # `typescript` resolvable from node_modules — without this install that
      # transpile step crashed with an opaque "Cannot read properties of
      # undefined (reading 'CommonJS')" instead of a clear "module not found".
      - run: pnpm install --frozen-lockfile
      - run: npm install -g eas-cli
      # EXPO_TOKEN is an Expo access token (expo.dev → account settings →
      # Access Tokens) — eas-cli picks it up automatically in non-interactive
      # mode, no `eas login` needed. The actual build runs on Expo's own
      # infrastructure; this job just uploads the project and waits, the same
      # as running `eas build` from a laptop.
      # `inputs.profile` only exists on a workflow_dispatch; on a push it is
      # empty, so main builds default to `preview` — an installable test build.
      # `production` stays deliberate: releasing is a decision, not a
      # consequence of merging.
      - name: Build Android
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
