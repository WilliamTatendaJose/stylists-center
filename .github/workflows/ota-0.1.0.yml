# Over-the-air update for installed 0.1.0 (preview) builds.
#
# Runs only on pushes to this branch, which carries main's app code with the
# two native modules 0.1.0 lacks (expo-image, expo-image-manipulator) swapped
# out and the version pinned to 0.1.0, so the update's runtime matches those
# installs and never reaches 0.2.0 builds. Not for merging into main.
name: OTA 0.1.0

on:
  push:
    branches: [claude/exciting-hawking-mfthly]

concurrency:
  group: ota-0-1-0
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sc/shared run build
      - run: pnpm --filter @sc/mobile run typecheck
      - run: npm install -g eas-cli
      # --environment preview loads the same EXPO_PUBLIC_* values the preview
      # build used (API URL, Firebase, MapTiler) from EAS.
      - name: Publish update
        working-directory: apps/mobile
        run: >-
          eas update --channel preview --environment preview --platform android
          --message "0.1.0 OTA - payment methods, earnings, slot picker, self-purchase fixes"
          --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
