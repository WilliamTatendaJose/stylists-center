name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sc
          POSTGRES_PASSWORD: sc
          POSTGRES_DB: sc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sc -d sc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        # Every apps/api/**/*.spec.ts hardcodes redis://localhost:6380 (matching
        # docker-compose.yml's own port choice, so local dev and CI agree) —
        # keep this mapping in sync with those, not with Redis's default 6379.
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sc:sc@localhost:5432/sc_test
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-secret-value-at-least-32-characters-long
      JWT_REFRESH_PEPPER: ci-pepper-value-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm format:check

      # apps/api/src/generated is gitignored (it's a build artifact, and a
      # large one) and nothing installs it automatically — `prisma migrate
      # deploy` only touches the database, it does not regenerate the
      # client. Every contributor's machine already has a copy sitting on
      # disk from whatever they last ran locally, which is exactly why this
      # was never missed until a fresh checkout (CI) needed it from
      # scratch: PrismaService's custom `output` path resolves to nothing,
      # so typecheck/lint see a client with no models on it at all.
      - run: pnpm --filter @sc/api prisma:generate

      # apps/api's test suite is integration-style against real tables (see
      # apps/api/README notes on migrations) — without this the fresh sc_test
      # database has no schema at all and every test fails with "relation does
      # not exist". Always `deploy`, never `dev` — see the hand-written
      # migrations for why.
      - run: pnpm --filter @sc/api prisma:migrate

      - run: pnpm turbo run typecheck lint test --cache-dir=.turbo

  # Deploys api + admin to Railway. Only after `verify` passes, and only on a
  # real push to main (not PRs — a fork or an unreviewed branch must never be
  # able to trigger a production deploy). db/redis aren't here: they're
  # static infra (Docker images), not app code that changes with a commit —
  # see RAILWAY.md.
  deploy-web:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # A second push landing mid-deploy should wait its turn, not race the
      # first — Railway serialises builds per service anyway, but queueing
      # here keeps the Actions log honest about what shipped when.
      group: deploy-web
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g @railway/cli
      # RAILWAY_TOKEN here is a *project* token (Project Settings → Tokens,
      # scoped to this project's production environment only) — not an
      # account token. `railway up` reads it with no `railway login`/`link`
      # step needed. `--ci` streams build logs and exits with the build's
      # real status, so a broken build fails this job instead of silently
      # returning success.
      - name: Deploy api
        run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy admin
        run: railway up --service admin --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
